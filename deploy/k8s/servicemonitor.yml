apiVersion: monitoring.coreos.com/v1                                                                                                                                            
kind: ServiceMonitor                
metadata:                                                                                                                                                                       
  name: warden                                                                                                                                                                  
  labels:                                                                                                                                                                       
    release: monitoring                                                                                                                                                         
spec:
  selector:                                                                                                                                                                     
    matchLabels:
      app: warden
  endpoints:
    - path: /metrics
      port: http